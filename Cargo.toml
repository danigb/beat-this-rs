[package]
name = "beat-this"
version = "1.1.0"
edition = "2021"
rust-version = "1.89"
description = "Rust port of Beat This! — AI-powered beat and downbeat tracking"
license = "MIT"
repository = "https://github.com/danigb/beat-this-rs"
homepage = "https://github.com/danigb/beat-this-rs"
documentation = "https://docs.rs/beat-this"
readme = "README.md"
keywords = ["beat-tracking", "music", "audio", "mir", "onnx"]
categories = ["multimedia::audio", "science"]
exclude = [
    "docs/",
    "scripts/",
    "test_files/",
    "tests/",
    "models/",
    ".github/",
    ".DS_Store",
    "Dockerfile",
    ".dockerignore",
]

[[bin]]
name = "beat-this"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "beat_this"
path = "src/lib.rs"

[features]
default = ["decode", "serde", "cli"]
cli = ["decode", "dep:clap", "dep:glob", "dep:hound", "dep:serde_json", "serde"]
decode = ["dep:symphonia"]
serde = ["dep:serde"]
# Opt-in ONNX Runtime backend (`--runtime ort`). Pure-Rust `rten` is the default
# and needs no system libraries; `ort` is kept as a maintainer reference oracle
# (cross-runtime parity, op-level `--profile`). See README /
# docs/tasks/015-default-runtime.
#
# `ort` is the CLI's configuration: the backend, `libonnxruntime` loaded at
# runtime (`ORT_DYLIB_PATH` / brew) and CoreML requested. `ort-backend` is the
# backend alone, with linking and execution providers left to the application
# (Cargo unifies features per build, so a linking choice made here applies to
# every other user of `ort` in the same binary). `ort-coreml` / `ort-cuda`
# forward the matching `ort` execution-provider features.
# (`ort?/…`, not `ort/…`: with a feature named like the dependency, the strong
# form would also activate the `ort` feature itself, and with it `load-dynamic`.)
ort = ["ort-backend", "ort?/load-dynamic", "ort-coreml"]
ort-backend = ["dep:ort", "dep:ndarray"]
ort-coreml = ["ort-backend", "ort?/coreml"]
ort-cuda = ["ort-backend", "ort?/cuda"]

[dependencies]
ort = { version = "=2.0.0-rc.14", optional = true, features = ["ndarray"] }
ndarray = { version = "0.17", optional = true }
rten = { version = "0.24", features = ["fft"] }
rten-tensor = { version = "0.24" }
anyhow = "1"
symphonia = { version = "0.6", features = ["all"], optional = true }
rubato = "3.0"
hound = { version = "3.5", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
glob = { version = "0.3", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
libc = "0.2"

[profile.release]
lto = true
strip = true

# Optimize dependencies (notably the pure-Rust `rten` inference backend) even in
# dev/test builds. `cargo test` is unoptimized, which makes rten's float math
# orders of magnitude slower — without this, the rten integration tests take ~30
# min in CI. This keeps our own crate at debug opt-level (fast incremental builds,
# debug assertions) while compiling deps with full optimization.
[profile.dev.package."*"]
opt-level = 3
